<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>오늘의 작은 정원 · My Little Garden</title><style>
:root{font-family:system-ui,'Apple SD Gothic Neo',sans-serif;color:#355344;background:#f8f8ed}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 5%,#fff1c7,transparent 25%),linear-gradient(#f4faee,#fff9ee);min-height:100vh}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:14px;padding:10px 14px;background:#e4efda;color:#355344;font-weight:700}button:hover{filter:brightness(.97)}button:focus-visible,input:focus-visible{outline:3px solid #81b99a;outline-offset:2px}.primary{background:#77ae86;color:white}.danger{background:#ffe2df;color:#a34d49}.shell{max-width:1150px;margin:auto;padding:24px 18px 60px}header{text-align:center;padding:18px 0 8px}h1{font-size:clamp(27px,4vw,43px);margin:0;color:#467b5d}h2{font-size:22px;margin:0 0 16px}h3{margin:0 0 12px}.subtitle{color:#718b78}.pill{display:inline-block;background:white;border-radius:30px;padding:8px 18px;box-shadow:0 5px 18px #cbdacb65}.topline{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;margin:14px 0}.tabs{display:flex;gap:10px;justify-content:center;margin:22px 0;flex-wrap:wrap}.tabs button.active{background:#6ba37d;color:white}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:#fffefa;border:1px solid #e6eedc;border-radius:26px;padding:24px;box-shadow:0 10px 28px #9ab29c20}.add{display:flex;gap:8px}.add input{flex:1;min-width:0}input[type=text],input[type=date]{padding:12px;border:1px solid #d8e5d3;border-radius:12px;background:#fff;width:100%}.todo{display:flex;align-items:center;gap:9px;padding:10px 4px;border-bottom:1px dashed #e1e9dc}.todo label{display:flex;align-items:center;gap:10px;flex:1;min-width:0;overflow-wrap:anywhere}.todo input[type=checkbox]{accent-color:#6aa37b;width:20px;height:20px;flex:none}.todo.done .tasktext{text-decoration:line-through;color:#a1ada0}.icon{padding:6px 9px;background:#f1f5eb}.muted{color:#87988b;font-size:14px}.actions{display:flex;gap:4px}.progress{height:14px;background:#e5eedf;border-radius:20px;overflow:hidden;margin:14px 0}.bar{height:100%;background:linear-gradient(90deg,#b9d894,#69b78d);width:0%;transition:width .6s}.plant-options{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:14px 0}.plant-option{padding:7px 3px;background:#f4f7ed;border:2px solid transparent;font-size:12px}.plant-option.selected{border-color:#80b791;background:#eaf5e6}.plant-option svg{width:100%;height:60px}.scene{position:relative;min-height:350px;border-radius:24px;background:linear-gradient(#e6f5ee 0%,#f5f9e6 78%,#e7e5cc 78%,#e4d7b6 100%);display:flex;align-items:center;justify-content:center;overflow:hidden}.scene:before{content:'☁️';position:absolute;top:22px;left:24px;font-size:37px;opacity:.7}.scene:after{content:'☀️';position:absolute;top:15px;right:25px;font-size:36px}.scene svg{width:min(90%,350px);height:320px;overflow:visible;filter:drop-shadow(0 7px 4px #7b8f7540)}.growth{position:absolute;top:18px;left:50%;transform:translateX(-50%);background:#fffefaeb;border-radius:30px;padding:8px 15px;font-weight:800;z-index:1}.scene.bump svg{animation:bump .6s ease}.spark{position:absolute;font-size:25px;pointer-events:none;animation:spark 1.1s ease forwards;z-index:3}@keyframes bump{0%,100%{transform:scale(1)}40%{transform:scale(1.06) rotate(2deg)}}@keyframes spark{0%{opacity:0;transform:translateY(15px) scale(.5)}40%{opacity:1}100%{opacity:0;transform:translateY(-90px) rotate(50deg)}}.center{text-align:center}.hidden{display:none!important}.garden-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:14px}.garden-item{text-align:center;background:#f3f8eb;border-radius:20px;padding:12px}.garden-item svg{width:135px;height:145px}.book-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.book-card{text-align:center;background:#f6f8ee;padding:14px;border-radius:18px}.book-card svg{height:125px;width:125px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.modal{position:fixed;inset:0;background:#324a3a80;display:flex;align-items:center;justify-content:center;z-index:10;padding:15px}.dialog{background:#fffef8;padding:30px;border-radius:25px;max-width:440px;width:100%;text-align:center;box-shadow:0 18px 60px #263a3355}.petal{position:fixed;top:-30px;pointer-events:none;z-index:20;animation:fall 2.4s linear forwards}@keyframes fall{to{transform:translateY(105vh) rotate(480deg);opacity:0}}.note{font-size:13px;color:#809284}.record{padding:12px;border-bottom:1px solid #e4eadf}.record.done{text-decoration:line-through;color:#95a597}@media(max-width:760px){.grid{grid-template-columns:1fr}.card{padding:17px}.shell{padding:15px 12px}.plant-options{gap:3px}.plant-option{font-size:10px}.scene{min-height:310px}.scene svg{height:280px}}
</style></head><body><div class="shell"><header><h1>🌱 오늘의 작은 정원</h1><p class="subtitle">오늘의 할 일을 완료하고 식물을 키워보세요!</p><div class="topline"><span class="pill" id="todayDate"></span><span class="pill" id="cheer"></span><span class="pill" id="headerRate">완료율 0%</span></div></header><nav class="tabs"><button class="active" data-view="today">🌿 오늘의 정원</button><button data-view="garden">🌼 나의 정원</button><button data-view="history">📅 날짜별 기록</button><button data-view="book">📖 식물 도감</button></nav><main><section id="today" class="view grid"><div class="card"><h2>📝 오늘의 할 일</h2><form id="addForm" class="add"><input id="newTask" type="text" maxlength="160" placeholder="오늘 할 일을 적어주세요" required aria-label="할 일 입력"><button class="primary">+ 추가</button></form><p class="note">할 일 옆의 ↑ ↓ 버튼으로 순서를 바꿀 수 있어요.</p><div id="todoList"></div><p id="taskCount" class="muted"></p><div class="progress"><div class="bar" id="taskBar"></div></div><div class="toolbar"><button id="soundToggle">🔇 효과음 끔</button><button id="exportBtn">⬇ JSON 내보내기</button><button id="importBtn">⬆ JSON 가져오기</button><input type="file" id="importFile" accept="application/json,.json" hidden><button class="danger" id="resetBtn">전체 기록 초기화</button></div></div><div class="card"><h2>🌷 오늘 키울 식물</h2><div id="plantOptions" class="plant-options"></div><div id="scene" class="scene"><span id="growthLabel" class="growth">0%</span><div id="plantArt"></div></div><p class="center" id="growthMessage"></p><div class="center"><button id="savePlant" class="primary hidden">🌷 나의 정원에 심기</button><p class="note" id="saveStatus"></p></div></div></section><section id="garden" class="view card hidden"><h2>🌼 나의 정원</h2><p id="gardenStats"></p><div id="gardenItems" class="garden-grid"></div></section><section id="history" class="view card hidden"><h2>📅 날짜별 기록</h2><p class="muted">과거 기록은 읽기 전용으로 표시되며 오늘의 성장에 영향을 주지 않습니다.</p><input type="date" id="historyDate" style="max-width:260px"><div id="historyDetail"></div></section><section id="book" class="view card hidden"><h2>📖 식물 도감</h2><div id="bookItems" class="book-grid"></div></section></main></div><div class="modal hidden" id="modal" role="dialog" aria-modal="true"><div class="dialog"><h2 id="modalTitle"></h2><p id="modalBody"></p><div id="modalActions" class="toolbar" style="justify-content:center"></div></div></div><script>
(()=>{'use strict';const KEY='my-little-garden-v1',names={hydrangea:'수국',tulip:'튤립',cactus:'선인장',clover:'네잎클로버',tomato:'토마토'},types=Object.keys(names),$=id=>document.getElementById(id),dateKey=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;let today=dateKey(),data={days:{},garden:{},sound:false},audio=null,shownCelebration=false;try{let raw=JSON.parse(localStorage.getItem(KEY));if(raw&&typeof raw==='object'){data.days=raw.days&&typeof raw.days==='object'?raw.days:{};data.garden=raw.garden&&typeof raw.garden==='object'?raw.garden:{};data.sound=raw.sound===true}}catch{}const validType=t=>types.includes(t)?t:'hydrangea';const normalizedDays=new WeakSet();function normalizeDay(key){let d=data.days[key];if(d&&typeof d==='object'&&normalizedDays.has(d))return d;if(!d||typeof d!=='object')d={tasks:[],plant:'hydrangea'};d.tasks=Array.isArray(d.tasks)?d.tasks.filter(t=>t&&typeof t.text==='string').slice(0,1000).map(t=>({id:String(t.id||crypto.randomUUID()),text:t.text.slice(0,160),done:t.done===true})):[];d.plant=validType(d.plant);data.days[key]=d;normalizedDays.add(d);return d}function day(){return normalizeDay(today)}function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch{alert('저장 공간이 부족하거나 브라우저 저장 기능을 사용할 수 없습니다. JSON 내보내기로 백업하세요.')}}function rate(d){return d.tasks.length?Math.round(d.tasks.filter(t=>t.done).length/d.tasks.length*100):0}function stage(p){return p===0?0:p<=20?1:p<=40?2:p<=60?3:p<100?4:5}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}const leaf=(x,y,s=1,flip=false,color='#6cab75')=>`<ellipse cx="${x}" cy="${y}" rx="${17*s}" ry="${9*s}" fill="${color}" transform="rotate(${flip?35:-35} ${x} ${y})"/>`,flower=(x,y,color='#ef9ab8',r=10)=>`<g>${[0,72,144,216,288].map(a=>`<ellipse cx="${x}" cy="${y-r}" rx="${r*.7}" ry="${r}" fill="${color}" transform="rotate(${a} ${x} ${y})"/>`).join('')}<circle cx="${x}" cy="${y}" r="${r*.5}" fill="#ffe6a0"/></g>`;
function art(type,p,mini=false){
 type=validType(type);const st=stage(p),q=p/100,y=210-(25+q*115);let body='';
 if(st===0){body='<ellipse cx="150" cy="215" rx="12" ry="7" fill="#987049"/>'}
 else if(type==='cactus'){
  body=`<path d="M150 215 L150 ${y+12}" stroke="#5caa80" stroke-width="${14+q*13}" stroke-linecap="round"/><ellipse cx="150" cy="${y+12}" rx="${8+q*7}" ry="${10+q*8}" fill="#70bd91"/>`;
  if(st>=3)body+=`<path d="M150 ${y+75} Q115 ${y+90} 120 ${y+48} M150 ${y+100} Q184 ${y+110} 181 ${y+65}" stroke="#5caa80" stroke-width="10" fill="none" stroke-linecap="round"/>`;
  if(st===5)body+=flower(150,y-9,'#f5b4b2',13);
 }else{
  body=`<path d="M150 217 Q146 ${y+60} 150 ${y}" stroke="#61966a" stroke-width="${4+q*3}" fill="none" stroke-linecap="round"/>`;
  if(type==='clover'){
   const n=st===1?1:st===2?2:st===3?3:st===4?3:4;
   for(let i=0;i<n;i++){let a=(i*90-45)*Math.PI/180,x=150+Math.cos(a)*17,yy=y+Math.sin(a)*17;body+=`<path d="M150 ${y+10} L${x} ${yy}" stroke="#589969" stroke-width="3"/><circle cx="${x-7}" cy="${yy-4}" r="11" fill="#6fbd83"/><circle cx="${x+7}" cy="${yy-4}" r="11" fill="#6fbd83"/>`}
  }else{
   body+=leaf(139,205,.6,false);
   if(st>=2)body+=leaf(163,y+28,.9,true);
   if(st>=3)body+=leaf(127,y+58,1.2,false)+leaf(171,y+75,1.1,true);
   if(st>=4)body+=leaf(129,y+15,1.15,false)+leaf(170,y+45,1.15,true);
   if(type==='tulip'&&st===5)body+=`<path d="M132 ${y+5} Q122 ${y-24} 139 ${y-26} L150 ${y-10} L161 ${y-26} Q179 ${y-23} 168 ${y+5} Q150 ${y+21} 132 ${y+5}" fill="#f19bb6" stroke="#dd789c" stroke-width="2"/>`;
   if(type==='hydrangea'&&st===5){for(let i=0;i<13;i++){let a=i*2.4,r=Math.sqrt(i)*12;body+=flower(150+Math.cos(a)*r,y+Math.sin(a)*r,'#b6a6e5',5.7)}}
   if(type==='tomato'){if(st>=4)body+=flower(150,y+2,'#fff3bb',9);if(st===5){for(const [x,yy,r] of [[131,y+20,15],[168,y+39,17],[148,y-1,13]])body+=`<circle cx="${x}" cy="${yy}" r="${r}" fill="#ef7767"/><path d="M${x-7} ${yy-r} l7 5 7 -5" fill="#5b9d65"/>`}}
  }
 }
 const pot=`<ellipse cx="150" cy="220" rx="58" ry="13" fill="#a46f50"/><path d="M99 221 L112 291 Q150 304 188 291 L201 221 Z" fill="#e8a77f" stroke="#ce8e6b" stroke-width="3"/><rect x="95" y="215" width="110" height="18" rx="7" fill="#efbb95"/><path d="M127 257 Q150 275 173 257" fill="none" stroke="#fff0d8" stroke-width="4" stroke-linecap="round"/>`;
 return `<svg viewBox="0 0 300 315" role="img" aria-label="${names[type]} 성장률 ${p}%"><ellipse cx="150" cy="300" rx="78" ry="9" fill="#a4ae8c" opacity=".3"/>${body}${pot}</svg>`;
}
function message(p){return p===0?'오늘의 씨앗을 심어볼까요?':p<=20?'작은 새싹이 돋아났어요!':p<=40?'조금씩 자라고 있어요!':p<=60?'잎이 무성해지고 있어요!':p<100?'꽃이 필 날이 가까워요!':'축하해요! 멋진 식물이 완성되었어요!'}function render(){let d=day(),p=rate(d),done=d.tasks.filter(t=>t.done).length;$('todayDate').textContent=new Intl.DateTimeFormat('ko-KR',{dateStyle:'full'}).format(new Date());$('headerRate').textContent=`완료율 ${p}%`;$('taskCount').textContent=`완료 현황: ${done} / ${d.tasks.length}`;$('taskBar').style.width=p+'%';$('growthLabel').textContent=p+'%';$('growthMessage').textContent=message(p);$('plantArt').innerHTML=art(d.plant,p);$('todoList').innerHTML=d.tasks.length?d.tasks.map((t,i)=>`<div class="todo ${t.done?'done':''}" data-id="${esc(t.id)}"><label><input type="checkbox" ${t.done?'checked':''} aria-label="${esc(t.text)} 완료"><span class="tasktext">${esc(t.text)}</span></label><div class="actions"><button class="icon" data-act="edit" aria-label="수정">✎</button><button class="icon" data-act="up" ${i===0?'disabled':''} aria-label="위로">↑</button><button class="icon" data-act="down" ${i===d.tasks.length-1?'disabled':''} aria-label="아래로">↓</button><button class="icon" data-act="delete" aria-label="삭제">×</button></div></div>`).join(''):'<p class="muted center" style="padding:28px">아직 할 일이 없어요. 첫 씨앗을 심어볼까요?</p>';$('plantOptions').innerHTML=types.map(t=>`<button class="plant-option ${d.plant===t?'selected':''}" data-plant="${t}" aria-pressed="${d.plant===t}">${art(t,100,true)}<span>${names[t]}</span></button>`).join('');let planted=!!data.garden[today];$('savePlant').classList.toggle('hidden',p!==100||planted);$('saveStatus').textContent=planted?'✓ 오늘의 식물을 정원에 심었어요!':'';$('soundToggle').textContent=data.sound?'🔊 효과음 켬':'🔇 효과음 끔';save()}function sound(win=false){if(!data.sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let start=audio.currentTime;for(let i=0;i<(win?3:1);i++){let o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=(win?[523,659,784][i]:660);g.gain.setValueAtTime(.0001,start+i*.12);g.gain.exponentialRampToValueAtTime(.12,start+i*.12+.02);g.gain.exponentialRampToValueAtTime(.0001,start+i*.12+.22);o.connect(g).connect(audio.destination);o.start(start+i*.12);o.stop(start+i*.12+.23)}}catch{}}function spark(){let s=$('scene');s.classList.remove('bump');void s.offsetWidth;s.classList.add('bump');for(let i=0;i<6;i++){let e=document.createElement('span');e.className='spark';e.textContent=i%2?'✦':'✨';e.style.left=(20+Math.random()*60)+'%';e.style.top=(45+Math.random()*35)+'%';s.append(e);setTimeout(()=>e.remove(),1150)}}function dialog(title,body,buttons){$('modalTitle').textContent=title;$('modalBody').textContent=body;$('modalActions').replaceChildren();for(let b of buttons){let el=document.createElement('button');el.textContent=b.text;el.className=b.class||'';el.onclick=()=>{close();b.action?.()};$('modalActions').append(el)}$('modal').classList.remove('hidden')}function close(){$('modal').classList.add('hidden')}function celebrate(){sound(true);for(let i=0;i<28;i++){let e=document.createElement('span');e.className='petal';e.textContent=['🌸','✨','🌼','⭐'][i%4];e.style.left=Math.random()*100+'vw';e.style.animationDelay=Math.random()*.8+'s';document.body.append(e);setTimeout(()=>e.remove(),3500)}dialog('🎉 오늘의 정원이 완성되었어요!','오늘의 모든 할 일을 완료했어요! 당신의 작은 실천이 멋진 꽃을 피웠어요!',[{text:'🌷 나의 정원에 심기',class:'primary',action:plant},{text:'나중에 심기'}])}function changed(prev,checked){render();if(checked){spark();sound()}let p=rate(day());if(p===100&&prev<100&&!data.garden[today])celebrate()}function plant(){let d=day();if(rate(d)!==100||data.garden[today])return;data.garden[today]={plant:d.plant,tasks:d.tasks.map(t=>({...t})),completedAt:new Date().toISOString()};save();render();show('garden')}function show(view){document.querySelectorAll('.view').forEach(e=>e.classList.toggle('hidden',e.id!==view));document.querySelectorAll('[data-view]').forEach(e=>e.classList.toggle('active',e.dataset.view===view));if(view==='garden')renderGarden();if(view==='history')renderHistory();if(view==='book')renderBook()}function renderGarden(){let entries=Object.entries(data.garden).filter(([k,v])=>/^\d{4}-\d{2}-\d{2}$/.test(k)&&v&&types.includes(v.plant)).sort((a,b)=>b[0].localeCompare(a[0]));$('gardenStats').textContent=`지금까지 키운 식물 ${entries.length}개 · 수집한 종류 ${new Set(entries.map(e=>e[1].plant)).size}/5`;$('gardenItems').innerHTML=entries.length?entries.map(([k,v])=>`<button class="garden-item" data-date="${k}">${art(v.plant,100)}<strong>${names[v.plant]}</strong><p>${k}</p><small>할 일 기록 보기</small></button>`).join(''):'<p class="muted">완성한 식물을 심으면 이곳에 모여요.</p>'}function renderHistory(){let k=$('historyDate').value||today,d=data.days[k],g=data.garden[k];if(!d&&!g){$('historyDetail').innerHTML='<p class="muted">이 날짜에는 기록이 없어요.</p>';return}let tasks=Array.isArray(d?.tasks)?d.tasks:Array.isArray(g?.tasks)?g.tasks:[],p=tasks.length?Math.round(tasks.filter(t=>t.done).length/tasks.length*100):0,t=validType(d?.plant||g?.plant);$('historyDetail').innerHTML=`<h3 style="margin-top:20px">${esc(k)} · ${names[t]} · 완료율 ${p}% ${g?'· 🌼 정원에 심음':''}</h3><div style="max-width:220px">${art(t,p)}</div>${tasks.map(t=>`<div class="record ${t.done?'done':''}">${t.done?'☑':'☐'} ${esc(t.text)}</div>`).join('')||'<p>할 일이 없어요.</p>'}`}function renderBook(){$('bookItems').innerHTML=types.map(t=>{let n=Object.values(data.garden).filter(v=>v?.plant===t).length;return `<div class="book-card">${art(t,100)}<h3>${names[t]}</h3><p>${n}번 완성 ${n?'🌟':'🌱'}</p></div>`}).join('')}function checkDate(){let k=dateKey();if(k!==today){today=k;shownCelebration=false;normalizeDay(today);render();$('historyDate').max=today;show('today')}}
$('addForm').onsubmit=e=>{e.preventDefault();let input=$('newTask'),text=input.value.trim();if(!text)return;let prev=rate(day());day().tasks.push({id:crypto.randomUUID(),text,done:false});input.value='';changed(prev,false);input.focus()};$('todoList').onchange=e=>{if(!e.target.matches('input[type=checkbox]'))return;let t=day().tasks.find(t=>t.id===e.target.closest('.todo').dataset.id);if(!t)return;let prev=rate(day());t.done=e.target.checked;changed(prev,t.done)};$('todoList').onclick=e=>{let btn=e.target.closest('[data-act]');if(!btn)return;let tasks=day().tasks,i=tasks.findIndex(t=>t.id===btn.closest('.todo').dataset.id);if(i<0)return;let prev=rate(day()),act=btn.dataset.act;if(act==='delete'){if(!confirm('이 할 일을 삭제할까요?'))return;tasks.splice(i,1)}if(act==='edit'){let text=prompt('할 일 수정',tasks[i].text);if(text===null)return;text=text.trim();if(!text)return alert('내용을 입력하세요.');tasks[i].text=text.slice(0,160)}if(act==='up'&&i>0)[tasks[i-1],tasks[i]]=[tasks[i],tasks[i-1]];if(act==='down'&&i<tasks.length-1)[tasks[i+1],tasks[i]]=[tasks[i],tasks[i+1]];changed(prev,false)};$('plantOptions').onclick=e=>{let btn=e.target.closest('[data-plant]');if(!btn)return;if(data.garden[today]&&!confirm('이미 정원에 심은 식물은 변경되지 않습니다. 오늘의 화면에서만 식물을 변경할까요?'))return;day().plant=btn.dataset.plant;render()};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>show(b.dataset.view));$('savePlant').onclick=plant;$('gardenItems').onclick=e=>{let btn=e.target.closest('[data-date]');if(!btn)return;$('historyDate').value=btn.dataset.date;show('history')};$('historyDate').onchange=renderHistory;$('soundToggle').onclick=()=>{data.sound=!data.sound;render();if(data.sound)sound()};$('exportBtn').onclick=()=>{let blob=new Blob([JSON.stringify({version:1,...data},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='my-little-garden-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{if(file.size>2e6)throw Error('파일이 너무 큽니다.');let v=JSON.parse(await file.text());if(!v||typeof v!=='object'||!v.days||typeof v.days!=='object'||Array.isArray(v.days)||!v.garden||typeof v.garden!=='object'||Array.isArray(v.garden))throw Error('올바른 백업 파일이 아닙니다.');if(!confirm('가져온 데이터로 현재 기록을 모두 덮어쓸까요?'))return;data={days:v.days,garden:v.garden,sound:v.sound===true};Object.keys(data.days).forEach(k=>normalizeDay(k));for(let [k,g]of Object.entries(data.garden)){if(!/^\d{4}-\d{2}-\d{2}$/.test(k)||!g||!types.includes(g.plant)||!Array.isArray(g.tasks))delete data.garden[k];else g.tasks=g.tasks.filter(t=>t&&typeof t.text==='string').slice(0,1000).map(t=>({text:t.text.slice(0,160),done:t.done===true,id:String(t.id||crypto.randomUUID())}))}save();render();show('today');alert('데이터를 가져왔어요.')}catch(err){alert('가져오기 실패: '+err.message)}finally{e.target.value=''}};$('resetBtn').onclick=()=>{if(!confirm('모든 할 일과 정원 기록을 삭제할까요? 복구할 수 없습니다.'))return;if(!confirm('정말 전체 기록을 초기화할까요?'))return;data={days:{},garden:{},sound:false};shownCelebration=false;save();render();show('today')};$('modal').onclick=e=>{if(e.target===$('modal'))close()};document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});$('historyDate').value=today;$('historyDate').max=today;$('cheer').textContent=['작은 실천이 모여 큰 성장을 만들어요!','오늘도 한 걸음씩 성장하는 중!','하나씩 완료하다 보면 꽃이 필 거예요!','당신의 정원이 조금씩 자라고 있어요!'][Math.floor(Math.random()*4)];normalizeDay(today);render();setInterval(checkDate,30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkDate()});})();
